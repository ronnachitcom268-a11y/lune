n (id) { return (Number(id) * 47) % 360; };\n  L.cover = function (s) {\n    if (s && s.cover_url) return L.cssUrl(s.cover_url) + \" center/cover\";\n    var h = L.hue(s ? s.id : 0);\n    return \"linear-gradient(145deg,hsl(\" + h + \" 50% 55%),hsl(\" + ((h + 40) % 360) + \" 45% 20%))\";\n  };\n  L.toast = function (m) {\n    var e = L.$(\"toast\"); if (!e) return;\n    e.textContent = m; e.classList.add(\"show\");\n    clearTimeout(L._t); L._t = setTimeout(function () { e.classList.remove(\"show\"); }, 2400);\n  };\n  var ERR = {\n    \"Invalid login credentials\": \"อีเมลหรือรหัสผ่านไม่ถูกต้อง\",\n    \"User already registered\": \"อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบ\",\n    \"Email not confirmed\": \"ยังไม่ได้ยืนยันอีเมล เช็คกล่องจดหมายแล้วกดลิงก์ยืนยัน\",\n    \"login required\": \"กรุณาเข้าสู่ระบบก่อน\",\n    \"invalid coupon\": \"รหัสส่วนลดไม่ถูกต้องหรือหมดสิทธิ์แล้ว\",\n    \"account banned\": \"บัญชีนี้ถูกระงับ\",\n    \"product not found\": \"ไม่พบรายการสินค้านี้\",\n    \"forbidden\": \"ไม่มีสิทธิ์ทำรายการนี้\",\n    \"not allowed\": \"ไม่มีสิทธิ์ทำรายการนี้\",\n    \"order is not pending\": \"รายการนี้ถูกตรวจสอบไปแล้ว\",\n    \"order is not paid\": \"รายการนี้ยังไม่ได้ชำระ จึงคืนเงินไม่ได้\"\n  };\n  L.err = function (e) {\n    var m = (e && (e.message || e.error_description)) || String(e || \"\");\n    if (ERR[m]) return ERR[m];\n    if (/password.*(at least|short)/i.test(m)) return \"รหัสผ่านสั้นเกินไป ควรมีอย่างน้อย 6 ตัวอักษร\";\n    if (/rate limit/i.test(m)) return \"ทำรายการถี่เกินไป รอสักครู่แล้วลองใหม่\";\n    if (/Failed to fetch|NetworkError/i.test(m)) return \"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่\";\n    return m;\n  };\n  L.getProfile = async function () {\n    if (!L.sb) return null;\n    var r = await L.sb.auth.getSession();\n    var ses = r.data && r.data.session;\n    if (!ses) return null;\n    var p = await L.sb.from(\"profiles\").select(\"*\").eq(\"id\", ses.user.id).maybeSingle();\n    if (!p.data) return { id: ses.user.id, email: ses.user.email, username: ses.user.email, plan: \"free\", role: \"user\", coins: 0 };\n    p.data.email = ses.user.email;\n    return p.data;\n  };\n  L.isVip = function (p) { return !!(p && p.plan === \"vip\" && p.plan_expires_at && new Date(p.plan_expires_at) > new Date()); };\n  L.setupNotice = function () {\n    return '<div style=\"max-width:560px;margin:60px auto;padding:20px;border:1px solid #f59e0b;border-radius:14px;line-height:1.7\">' +\n      \"<h2 style='margin:0 0 8px'>ยังไม่ได้เชื่อมต่อฐานข้อมูล<\/h2>\" +\n      \"<p style='margin:0'>เปิดไฟล์ <b>config.js<\/b> แล้วใส่ SUPABASE_URL และ SUPABASE_ANON_KEY จากหน้า Project Settings &gt; API ของ Supabase จากนั้นรีเฟรชหน้านี้ (ขั้นตอนเต็มอยู่ใน README.md)<\/p><\/div>\";\n  };\n  /* ---- QR พร้อมเพย์ ---- */\n  L.dg = function (t) { return String(t || \"\").replace(/\\D/g, \"\"); };\n  function crc16(t) { var c = 0xFFFF; for (var i = 0; i < t.length; i++) { c ^= t.charCodeAt(i) << 8; for (var k = 0; k < 8; k++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return (\"0000\" + c.toString(16).toUpperCase()).slice(-4); }\n  function tlv(t, v) { return t + (\"0\" + v.length).slice(-2) + v; }\n  L.crc16 = crc16;\n  L.ppValid = function (pp) { if (!pp) return false; var d = L.dg(pp.id); return pp.type === \"phone\" ? /^0\\d{9}$/.test(d) : d.length === 13; };\n  L.ppPayload = function (type, id, amt) {\n    var d = L.dg(id), sub = type === \"phone\" ? \"01\" : \"02\", tg = type === \"phone\" ? \"0066\" + d.replace(/^0/, \"\") : d;\n    var a = tlv(\"00\", \"A000000677010111\") + tlv(sub, tg);\n    var q = tlv(\"00\", \"01\") + tlv(\"01\", amt > 0 ? \"12\" : \"11\") + tlv(\"29\", a) + tlv(\"58\", \"TH\") + tlv(\"53\", \"764\") + (amt > 0 ? tlv(\"54\", Number(amt).toFixed(2)) : \"\") + \"6304\";\n    return q + crc16(q);\n  };\n  L.qrSvg = function (text) {\n    try { var q = qrcode(0, \"M\"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: tru \/script>\n<script>\nconst {sb,$,esc,money,toast}=L;\nconst S={me:null,prods:[],ps:null,item:0,m:\"\",coupon:\"\",contact:\"\",order:null,orders:[],busy:false,tab:\"in\",poll:null};\nconst KIND={vip_month:\"VIP\",vip_year:\"VIP\",coins:\"เหรียญ\"};\nconst ST={pending:\"รอตรวจสอบ\",paid:\"ชำระแล้ว\",rejected:\"ไม่ผ่าน\",refunded:\"คืนเงินแล้ว\"};\nconst mask=s=>{s=L.dg(s);return s.length>4?s.slice(0,3)+\"-\"+\"x\".repeat(Math.max(0,s.length-7))+\"-\"+s.slice(-4):s};\nconst copyBtn=(t,l)=>`<button class=\"btn\" style=\"padding:3px 12px;font-size:13px\" data-a=\"copy\" data-v=\"${esc(t)}\" aria-label=\"คัดลอก${l}\">คัดลอก<\/button>`;\n\nasync function load(){\n S.me=await L.getProfile();\n const [p,s]=await Promise.all([sb.from(\"products\").select(\"*\").eq(\"active\",true).order(\"sort\"),sb.from(\"payment_settings\").select(\"*\").eq(\"id\",1).maybeSingle()]);\n S.prods=p.data||[];S.ps=s.data||{};\n if(S.me){const o=await sb.from(\"orders\").select(\"*\").order(\"created_at\",{ascending:false}).limit(20);S.orders=o.data||[];if(!S.contact){const lo=S.orders.find(x=>x.contact);if(lo)S.contact=lo.contact}}\n}\nfunction methods(){const c=S.ps||{},m=[];if(c.pp&&L.ppValid(c.pp))m.push([\"promptpay\",\"สแกน QR พร้อมเพย์\"]);if(c.tm&&c.tm.phone)m.push([\"truemoney\",\"TrueMoney Wallet\"]);if(c.banks&&c.banks.length)m.push([\"bank\",\"โอนผ่านบัญชีธนาคาร\"]);return m}\nfunction detail(o){\n const c=S.ps;\n if(o.method==\"promptpay\"){const p=c.pp;return `<div class=\"qrb\">${L.qrSvg(L.ppPayload(p.type,p.id,Number(o.amount)))||\"สร้าง QR ไม่สำเร็จ\"}<\/div><dl class=\"kv\"><dt>ชื่อบัญชี<\/dt><dd>${esc(p.name)}<\/dd><dt>พร้อมเพย์<\/dt><dd>${esc(mask(p.id))}<\/dd><\/dl><ol class=\"steps\"><li>เปิดแอปธนาคารแล้วเลือกสแกน QR (แคปหน้าจอแล้วเลือกจากอัลบั้มได้)<\/li><li>ตรวจชื่อบัญชีและยอดให้ตรง แล้วยืนยันการโอน<\/li><\/ol>`}\n if(o.method==\"truemoney\"){const t=c.tm,ph=t.phone;return `<div class=\"num\"><b>${esc(ph.replace(/(\\d{3})(\\d{3})(\\d{4})/,\"$1-$2-$3\"))}<\/b>${copyBtn(ph,\" เบอร์\")}<\/div><dl class=\"kv\"><dt>ชื่อบัญชี<\/dt><dd>${esc(t.name||\"\")}<\/dd><\/dl><ol class=\"steps\"><li>เปิดแอป TrueMoney Wallet แล้วเลือกโอนเงิน<\/li><li>กรอกเบอร์ด้านบนและยอด ${money(o.amount)}<\/li><li>ตรวจชื่อผู้รับ ยืนยัน และเก็บสลิปไว้<\/li><\/ol>`}\n return (c.banks||[]).map(b=>`<div class=\"bk\"><b>${esc(b.bank)}<\/b><div class=\"num\">${esc(b.no)} ${copyBtn(b.no,\" เลขบัญชี\")}<\/div><div class=\"nt\">${esc(b.name)}${b.branch?\" • \"+esc(b.branch):\"\"}<\/div><\/div>`).join(\"\")+`<ol class=\"steps\"><li>โอนเข้าบัญชีใดบัญชีหนึ่งตามยอด ${money(o.amount)}<\/li><li>ตรวจชื่อบัญชี ยืนยัน และเก็บสลิปไว้<\/li><\/ol>`}\nconst mname={promptpay:\"พร้อมเพย์\",truemoney:\"TrueMoney\",bank:\"โอนธนาคาร\"};\nfunction ordersH(){return S.orders.length?`<section class=\"sec\"><h2>รายการสั่งซื้อของฉัน<\/h2>${S.orders.map(o=>`<div class=\"ord\"><div><b>${esc(o.product_name)}<\/b><small>${esc(o.ref)} • ${mname[o.method]} • ${L.dateTime(o.created_at)}<\/small><\/div><div style=\"text-align:right\"><b>${money(o.amount)}<\/b><br><span class=\"st ${o.status}\">${ST[o.status]}<\/span>${o.status==\"pending\"&&!o.slip_path?` <button class=\"btn\" style=\"padding:2px 12px;font-size:13px\" data-a=\"resume\" data-v=\"${esc(o.ref)}\">แนบสลิป<\/button>`:\"\"}<\/div><\/div>`).join(\"\")}<\/section>`:\"\"}\nfunction render(){\n const a=$(\"app\");\n if(!S.me){a.innerHTML=`<section class=\"sec\"><h2>เข้าสู่ระบบก่อนชำระเงิน<\/h2><p class=\"nt\">เพื่อให้สิทธิ์ VIP และเหรียญเข้าบัญชีของคุณ<\/p><form id=\"lf\" novalidate><div class=\"tabs\"><button type=\"button\" data-a=\"tab\" data-v=\"in\" aria-pressed=\"${S.tab==\"in\"}\">เข้าสู่ระบบ<\/button><button type=\"button\" data-a=\"tab\" data-v=\"up\" aria-pressed=\"${S.tab==\"up\"}\">สมัครสมาชิก<\/button><\/div>${S.tab==\"up\"?'<div class=\"fl\"><label for=\"lu\">ชื่อผู้ใช้<\/label><input id=\"lu\" maxlength=\"24\"><\/div>':\"\"}<div class=\"fl\"><label for=\"le\">อีเมล<\/label><input id=\"le\" type=\"email\" autocomplete=\"email\"><\/div><div class=\"fl\"><label for=\"lp\">รหัสผ่าน<\/label><input id=\"lp\" type=\"password\" autocomplete=\"current-password\"><\/div><span class=\"msg\" id=\"lm\" role=\"alert\"><\/span><button class=\"btn p\">${S.tab==\"up\"?\"สมัครสมาชิก\":\"เข้าสู่ระบบ\"}<\/button><\/form><\/section>`;return}\n const ms=methods();if(!S.m||!ms.some(m=>m[0]==S.m))S.m=ms.length?ms[0][0]:\"\";\n let h=`<p class=\"nt\">บัญชี: <b>${esc(S.me.username||S.me.email)}<\/b> • ${L.isVip(S.me)?\"VIP ถึง \"+L.date(S.me.plan_expires_at):\"ยังไม่เป็น VIP\"} • เหรียญ ${(S.me.coins||0).toLocaleString(\"th-TH\")} <button class=\"btn\" style=\"padding:1px 12px;font-size:13px\" data-a=\"logout\">ออกจากระบบ<\/button><\/p>`;\n const pend=S.orders.find(x=>x.status==\"pending\");const o=pend||S.order;\n if(o){\n  h+=`<section class=\"sec\"><h2>ชำระเงิน ${esc(o.product_name)}<\/h2><div class=\"amt\"><span>ยอดที่ต้องโอน<\/span><b>${money(o.amount)}<\/b><\/div><dl class=\"kv\"><dt>รหัสอ้างอิง<\/dt><dd><b>${esc(o.ref)}<\/b> ${copyBtn(o.ref,\" รหัส\")}<\/dd><dt>ช่องทาง<\/dt><dd>${mname[o.method]}<\/dd>${o.contact?`<dt>LINE ID<\/dt><dd>${esc(o.contact)}<\/dd>`:\"\"}<\/dl>${detail(o)}<\/section>\n  <section class=\"sec\"><h2>แนบสลิปการโอน<\/h2>${o.slip_path?`<p>ส่งสลิปแล้ว ทีมงานกำลังตรวจสอบ เมื่อผ่านแล้วสิทธิ์จะเข้าบัญชีอัตโนมัติ (หน้านี้อัปเดตเอง)<\/p>`:`<div class=\"fl\"><label for=\"sf\">รูปสลิป (JPG, PNG ไม่เกิน 5 MB)<\/label><input id=\"sf\" type=\"file\" accept=\"image/*\"><\/div><span class=\"msg\" id=\"sm\" role=\"alert\"><\/span><button class=\"btn p\" data-a=\"slip\"${S.busy?\" disabled\":\"\"}>ส่งสลิป<\/button> ${o.status==\"pending\"?`<p class=\"nt\">คุณมีรายการที่รอดำเนินการอยู่ จึงสั่งซื้อรายการใหม่ไม่ได้จนกว่าทีมงานจะตรวจสอบ ถ้าต้องการเปลี่ยนรายการ กรุณาติดต่อทีมงาน<\/p>`:`<button class=\"btn\" data-a=\"newo\">ยกเลิก / ทำรายการใหม่<\/button>`}`}${S.ps.contact?`<p class=\"nt\">มีปัญหาติดต่อ: ${esc(S.ps.contact)}<\/p>`:\"\"}<\/section>`;\n }else if(!ms.length||!S.prods.length){\n  h+=`<section class=\"sec\"><h2>ยังไม่เปิดรับชำระเงินออนไลน์<\/h2><p class=\"nt\">${S.ps&&S.ps.contact?\"ติดต่อทีมงานที่ \"+esc(S.ps.contact):\"กรุณาติดต่อทีมงาน\"}<\/p><\/section>`;\n }else{\n  const it=S.prods[S.item]||S.prods[0];\n  h+=`<section class=\"sec\"><h2><b>1<\/b>เลือกรายการ<\/h2><div class=\"items\">${S.prods.map((x,i)=>`<button class=\"it\" data-a=\"item\" data-v=\"${i}\" aria-pressed=\"${i==S.item}\"><span>${esc(x.name)}<small class=\"nt\" style=\"display:block\">${x.kind==\"coins\"?x.coins.toLocaleString(\"th-TH\")+\" เหรียญ\":x.days+\" วัน\"}<\/small><\/span><b>${money(x.price)}<\/b><\/button>`).join(\"\")}<\/div><\/section>\n  <section class=\"sec\"><h2><b>2<\/b>วิธีชำระเงิน<\/h2><div class=\"tabs\">${ms.map(m=>`<button data-a=\"m\" data-v=\"${m[0]}\" aria-pressed=\"${S.m==m[0]}\">${m[1]}<\/button>`).join(\"\")}<\/div><\/section>\n  <section class=\"sec\"><h2><b>3<\/b>รหัสส่วนลด (ถ้ามี)<\/h2><div class=\"row\"><input id=\"cp\" aria-label=\"รหัสส่วนลด\" value=\"${esc(S.coupon)}\" placeholder=\"เช่น WELCOME10\"><\/div><p class=\"nt\">ระบบจะคิดส่วนลดและยอดสุดท้ายให้ตอนกดสั่งซื้อ<\/p><div class=\"fl\" style=\"margin-top:12px\"><label for=\"ct\">LINE ID ของคุณ (ไว้ติดต่อเมื่อสลิปมีปัญหา) *<\/label><input id=\"ct\" maxlength=\"60\" value=\"${esc(S.contact)}\" placeholder=\"เช่น @yourid\" autocomplete=\"off\"><\/div><span class=\"msg\" id=\"om\" role=\"alert\"><\/span><button class=\"btn p\" data-a=\"order\"${S.busy?\" disabled\":\"\"}>สั่งซื้อ ${esc(it.name)} • ${money(it.price)}<\/button><\/section>`;\n }\n a.innerHTML=h+ordersH();\n}\nfunction startPoll(){clearInterval(S.poll);S.poll=setInterval(async()=>{if(!S.me||!S.orders.some(o=>o.status==\"pending\"))return;const r=await sb.from(\"orders\").select(\"*\").order(\"created_at\",{ascending:false}).limit(20);if(r.error)return;const was=S.orders;S.orders=r.data||[];if(S.order){const n=S.orders.find(o=>o.ref==S.order.ref);if(n)S.order=n}\n if(was.some(o=>o.status==\"pending\"&&S.orders.find(x=>x.id==o.id&&x.status==\"paid\"))){S.me=await L.getProfile();toast(\"ชำระเงินสำเร็จ สิทธิ์เข้าบัญชีแล้ว\")}\n if(!document.activeElement||document.activeElement.type!=\"file\")render()},15000)}\n\ndocument.addEventListener(\"click\",async e=>{\n const t=e.target.closest(\"[data-a]\");if(!t)return;const a=t.dataset.a,v=t.dataset.v;\n if(a==\"copy\"){try{await navigator.clipboard.writeText(v);toast(\"คัดลอกแล้ว\")}catch(x){toast(\"คัดลอกไม่ได้ ลองกดค้างที่ข้อความ\")}}\n else if(a==\"item\"){S.item=+v;render()}\n else if(a==\"m\"){S.m=v;render()}\n else if(a==\"tab\"){S.tab=v;render()}\n else if(a==\"logout\"){await sb.auth.signOut();S.me=null;S.order=null;S.orders=[];render()}\n else if(a==\"newo\"){S.order=null;render()}\n else if(a==\"resume\"){S.order=S.orders.find(o=>o.ref==v);render()}\n else if(a==\"order\"){\n  const m=$(\"om\");m.textContent=\"\";S.coupon=$(\"cp\").value.trim();S.contact=$(\"ct\").value.trim();if(S.contact.length<2){m.textContent=\"กรุณากรอก LINE ID เพื่อให้ทีมงานติดต่อได้\";$(\"ct\").focus();return}S.busy=true;render();\n  const it=S.prods[S.item];\n  const r=await sb.rpc(\"create_order\",{p_product:it.id,p_method:S.m,p_coupon:S.coupon||null,p_contact:S.contact});\n  S.busy=false;\n  if(r.error){if(/pending order/.test(r.error.message||\"\")){const q=await sb.from(\"orders\").select(\"*\").order(\"created_at\",{ascending:false}).limit(20);S.orders=q.data||[];render();toast(\"คุณมีรายการที่รอตรวจสอบอยู่แล้ว\");return}render();$(\"om\").textContent=L.err(r.error);return}\n  const o=await sb.from(\"orders\").select(\"*\").eq(\"ref\",r.data.ref).single();\n  S.order=o.data;S.orders.unshift(o.data);render();window.scrollTo(0,0)}\n else if(a==\"slip\"){\n  const f=$(\"sf\").files[0],m=$(\"sm\");m.textContent=\"\";\n  if(!f){m.textContent=\"กรุณาเลือกรูปสลิป\";return}\n  if(!/^image\\//.test(f.type)){m.textContent=\"ไฟล์ต้องเป็นรูปภาพ\";return}\n  if(f.size>5*1024*1024){m.textContent=\"ไฟล์ใหญ่เกิน 5 MB\";return}\n  S.busy=true;t.disabled=true;\n  const ext=(f.name.split(\".\").pop()||\"jpg\").toLowerCase().replace(/[^a-z0-9]/g,\"\").slice(0,5)||\"jpg\";\n  const path=S.me.id+\"/\"+S.order.ref+\".\"+ext;\n  const up=await sb.storage.from(\"slips\").upload(path,f,{upsert:true,contentType:f.type});\n  if(up.error){S.busy=false;t.disabled=false;m.textContent=L.err(up.error);return}\n  const r=await sb.rpc(\"attach_slip\",{p_ref:S.order.ref,p_path:path});\n  S.busy=false;\n  if(r.error){t.disabled=false;m.textContent=L.err(r.error);return}\n  S.order.slip_path=path;const i=S.orders.findIndex(o=>o.ref==S.order.ref);if(i>-1)S.orders[i].slip_path=path;\n  toast(\"ส่งสลิปแล้ว\");render()}\n});\ndocument.addEventListener(\"submit\",async e=>{\n if(e.target.id!=\"lf\")return;e.preventDefault();\n const em=$(\"le\").value.trim(),pw=$(\"lp\").value,m=$(\"lm\"),up=S.tab==\"up\";m.textContent=\"\";\n if(!em||!pw){m.textContent=\"กรุณากรอกอีเมลและรหัสผ่าน\";return}\n let r;\n if(up){const un=$(\"lu\").value.trim();if(!un){m.textContent=\"กรุณาตั้งชื่อผู้ใช้\";return}r=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un}}});\n  if(!r.error&&!r.data.session){m.style.color=\"#8fe3c4\";m.textContent=\"สมัครแล้ว ยืนยันอีเมลตามลิงก์ที่ส่งไป แล้วกลับมาเข้าสู่ระบบ\";return}}\n else r=await sb.auth.signInWithPassword({email:em,password:pw});\n if(r.error){m.textContent=L.err(r.error);return}\n await load();render()});\n(async function(){\n if(!L.ready){$(\"app\").innerHTML=L.setupNotice();return}\n await load();render();startPoll()})();\n<\/script>\n<script>addEventListener(\"hashchange\",function(){location.reload()})<\/script>\n<\/body>\n<\/html>\n"};
var h=(location.hash||"").replace("#","");
var k=h==="admin"?"admin":h==="pay"?"pay":"front";
document.open();document.write(P[k]);document.close();
</script></body></html>
